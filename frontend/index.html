<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="dns-prefetch" href="//picdrift.studio" />
    <link rel="dns-prefetch" href="//visualfx.studio" />
    <link rel="preconnect" href="https://picdrift.studio" crossorigin />
    <link rel="preconnect" href="https://visualfx.studio" crossorigin />
    <meta name="theme-color" content="#6366f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Social share preview (Open Graph + Twitter). Crawlers read these from the
         STATIC HTML and DON'T run JS, so the JS tab-title script below can't fix
         them — per-domain values (e.g. drift.li) must be swapped at the edge/server.
         See cloudflare/drift-og-worker.js for the drift.li override. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PicDrift Studio" />
    <meta property="og:title" content="PicDrift Studio - AI Content Generation Studio" />
    <meta property="og:description" content="Create scroll-stopping content with AI — images, video, and interactive product drifts." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PicDrift Studio - AI Content Generation Studio" />
    <meta name="twitter:description" content="Create scroll-stopping content with AI — images, video, and interactive product drifts." />
    <title>PicDrift Studio - AI Content Generation Studio</title>
    <script>
      // Domain-aware browser tab title. Runs before React so there is no flash
      // of the wrong brand. Mirrors getSiteBrandFromHostname() in lib/branding.ts.
      (function () {
        var h = (location.hostname || "").trim().toLowerCase();
        var title = "PicDrift Studio - AI Content Generation Studio";
        if (h === "byok.link" || h === "www.byok.link") {
          title = "BYOK - AI Content Studio";
        } else if (h.indexOf("visualfx") !== -1) {
          title = "VisualFX Studio - AI Content Generation Studio";
        } else if (h === "drift.li" || h === "www.drift.li") {
          title = "Drift Link — Interactive Drift Paths";
        }
        document.title = title;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
